name: Bug report
description: Report reproducible unexpected behavior
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove device addresses, serial numbers and battery notes before posting.
  - type: input
    id: version
    attributes:
      label: MC3000 Control version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Raspberry Pi 4, Raspberry Pi OS Bookworm 64-bit, MC3000 FW 1.25
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Attach the anonymized diagnostics ZIP from Settings if relevant.
