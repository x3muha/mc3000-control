name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q mc3000_control
      - run: python -m pip check

  static-checks:
    name: Static files and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --check mc3000_control/static/app.js
      - run: node --check mc3000_control/static/demo.js
      - run: node --check mc3000_control/static/i18n.js
      - run: node --check mc3000_control/static/sw.js
      - run: node --check mc3000_control/static/theme-init.js
      - run: node --check mc3000_control/static/login.js
      - run: bash -n install.sh deploy/*.sh scripts/*.sh
      - run: python -m json.tool mc3000_control/static/manifest.webmanifest >/dev/null

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test,audit]'
      - run: ruff check mc3000_control tests scripts/third_party_notices.py
      - run: bandit -q -r mc3000_control -x mc3000_control/static -s B608
      - run: pip-audit --local --progress-spinner off
      - run: python scripts/third_party_notices.py --check

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
