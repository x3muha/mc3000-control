[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mc3000-control"
version = "0.18.4"
description = "Lokale Mehrgeraete-Weboberflaeche fuer SkyRC MC3000 Ladegeraete"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "bleak>=3.0,<4",
  "fastapi>=0.115,<1",
  "segno>=1.6,<2",
  "reportlab>=4.2,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.urls]
Repository = "https://github.com/x3muha/mc3000-control"

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
mc3000-control = "mc3000_control.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mc3000_control*"]

[tool.setuptools.package-data]
mc3000_control = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
