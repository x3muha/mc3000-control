[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mc3000-control"
version = "1.0.0"
description = "Local multi-charger web interface for SkyRC MC3000 chargers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "bleak>=3.0,<4",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "segno>=1.6,<2",
  "reportlab>=4.2,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.urls]
Repository = "https://github.com/x3muha/mc3000-control"

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
]
audit = [
  "bandit>=1.9,<2",
  "build>=1.5,<2",
  "pip-licenses>=5.5,<6",
  "pip-audit>=2.10,<3",
  "ruff>=0.16,<1",
]

[project.scripts]
mc3000-control = "mc3000_control.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mc3000_control*"]

[tool.setuptools.package-data]
mc3000_control = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pip-licenses]
from = "mixed"
order = "name"
allow-only = "Apache Software License;BSD License;BSD-3-Clause;MIT;MIT License;MIT-CMU;PSF-2.0;Python Software Foundation License"
